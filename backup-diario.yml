name: Backup diario de la base de datos

on:
  schedule:
    # 08:00 UTC = 04:00 hora de Bolivia (UTC-4). Ajusta si quieres otra hora.
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio de backups
        uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Generar el respaldo (pg_dump)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          FECHA=$(date +'%Y-%m-%d')
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -F p -f "backups/backup-$FECHA.sql"

      - name: Borrar respaldos con más de 30 días (mantener el repo liviano)
        run: |
          find backups -name "backup-*.sql" -mtime +30 -delete

      - name: Subir el respaldo al repositorio
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "Backup automático $(date +'%Y-%m-%d')"
          git push
